# Catalogue des sources Open Data collectées par l'étape 1.
#
# Chaque entrée décrit UN jeu de données. Le collecteur le télécharge tel quel
# (couche bronze = brut, immuable) et journalise chaque appel HTTP.
#
# Champs :
#   kind      : type de connecteur (opendatasoft | http_json | prim)
#   enabled   : false pour désactiver sans supprimer
#   schedule  : hourly | daily | weekly (filtré par `comptage ingest --schedule ...`)
#               GitHub Actions : hourly toutes les heures, daily à 05:30 UTC,
#               weekly le lundi 06:37 UTC. Un contenu inchangé n'est jamais re-stocké.
#   verified  : false tant que l'identifiant n'a pas été confirmé par
#               `comptage check-sources` (lancé chaque jour par GitHub Actions)
#
# Si `check-sources` signale un KO, chercher l'identifiant actuel sur
# data.gouv.fr (les ressources pointent vers l'API du producteur).

sources:
  # --- SNCF Open Data (Opendatasoft, API Explore v2.1) ----------------------
  - name: sncf_comptage_montants_trains
    kind: opendatasoft
    base_url: https://ressources.data.sncf.com
    dataset_id: comptage-voyageurs-trains-transilien
    schedule: daily
    enabled: true
    verified: true

  - name: sncf_frequentation_gares
    kind: opendatasoft
    base_url: https://ressources.data.sncf.com
    dataset_id: frequentation-gares
    schedule: daily
    enabled: true
    verified: true

  # Référentiel des gares SNCF (code UIC + coordonnées) : sert à relier les
  # comptages SNCF (codes UIC) aux validations IDFM (zones de correspondance).
  - name: sncf_liste_gares
    kind: opendatasoft
    base_url: https://ressources.data.sncf.com
    dataset_id: liste-des-gares
    schedule: weekly
    enabled: true
    verified: false

  # --- Île-de-France Mobilités (portail Opendatasoft) -----------------------
  # Référentiel des gares et stations par ligne (id_ref_zdc + coordonnées).
  - name: idfm_emplacement_gares
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: emplacement-des-gares-idf
    schedule: weekly
    enabled: true
    verified: false

  # IDFM publie un jeu par numéro de trimestre (1er à 4ème) et le remplace par
  # l'année la plus récente à chaque publication. On collecte les quatre :
  # le bronze garde chaque version, donc l'historique des années passées.
  - name: idfm_validations_ferre_jour_t1
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-nombre-validations-par-jour-1er-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_jour_t2
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-nombre-validations-par-jour-2eme-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_jour_t3
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-nombre-validations-par-jour-3eme-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_jour_t4
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-nombre-validations-par-jour-4eme-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_profils_horaires_t1
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-profils-horaires-par-jour-type-1er-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_profils_horaires_t2
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-sur-le-reseau-ferre-profils-horaires-par-jour-type-2eme-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_profils_horaires_t3
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-profils-horaires-par-jour-type-3eme-trimestre
    schedule: daily
    enabled: true
    verified: true

  - name: idfm_validations_ferre_profils_horaires_t4
    kind: opendatasoft
    base_url: https://data.iledefrance-mobilites.fr
    dataset_id: validations-reseau-ferre-profils-horaires-par-jour-type-4eme-trimestre
    schedule: daily
    enabled: true
    verified: true

  # --- Contexte calendaire ---------------------------------------------------
  - name: education_calendrier_scolaire
    kind: opendatasoft
    base_url: https://data.education.gouv.fr
    dataset_id: fr-en-calendrier-scolaire
    schedule: daily
    enabled: true
    verified: true

  - name: jours_feries_metropole
    kind: http_json
    url: https://calendrier.api.gouv.fr/jours-feries/metropole.json
    schedule: daily
    enabled: true
    verified: true

  # --- Météo (Open-Meteo, gratuit, sans clé) --------------------------------
  # Prévisions horaires sur Paris : collectées chaque heure, elles
  # deviennent un historique de prévisions (utile pour l'étape 4).
  - name: openmeteo_prevision_paris
    kind: http_json
    url: https://api.open-meteo.com/v1/forecast
    params:
      latitude: 48.8566
      longitude: 2.3522
      hourly: temperature_2m,precipitation,rain,snowfall,wind_speed_10m,weather_code
      timezone: Europe/Paris
      past_days: 2
      forecast_days: 7
    schedule: hourly
    enabled: true
    verified: false

  # Historique météo observé (réanalyse ERA5, gratuit, sans clé), un point par jour
  # depuis 2019 : sert à expliquer et extrapoler la fréquentation (étape 3).
  # Le jeu entier est redemandé chaque jour : il ne change que par son dernier jour.
  - name: openmeteo_historique_paris
    kind: http_json
    url: https://archive-api.open-meteo.com/v1/archive
    params:
      latitude: 48.8566
      longitude: 2.3522
      start_date: "2019-01-01"
      end_date: "{aujourd_hui-1}"
      daily: temperature_2m_mean,temperature_2m_max,precipitation_sum,snowfall_sum,wind_speed_10m_max,weather_code
      timezone: Europe/Paris
    schedule: daily
    enabled: true
    verified: false

  # --- PRIM (temps réel, clé requise) ---------------------------------------
  # Reste inactif tant que PRIM_API_KEY est vide (.env en local, secret
  # GitHub en CI). Quotidien pour l'instant : un instantané temps réel de
  # toutes les lignes pèse plusieurs Mo, trop lourd pour Git en horaire.
  # Le passage à une fréquence plus fine se fera sur le VPS.
  - name: prim_estimated_timetable
    kind: prim
    url: https://prim.iledefrance-mobilites.fr/marketplace/estimated-timetable
    params:
      LineRef: ALL
    schedule: daily
    enabled: true
    verified: false
